<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refynora</title>
<style>
  :root { --bg:#fff; --fg:#141416; --muted:#5b5b60; --line:#e6e6ea; --accent:#B03D24; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f11; --fg:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --accent:#E96A4B; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 68ch; margin: 0 auto; padding: 40px 20px 80px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:32px; flex-wrap:wrap; }
  header a.brand { font-weight:700; text-decoration:none; color:var(--fg); letter-spacing:-.01em; font-size:20px; }
  header a.brand span { color:var(--accent); }
  nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:15px; }
  nav a[aria-current] { color:var(--fg); font-weight:600; }
  h1 { font-size:30px; line-height:1.2; letter-spacing:-.02em; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:15px; margin:0 0 28px; }
  h2 { font-size:20px; margin:32px 0 8px; letter-spacing:-.01em; }
  h3 { font-size:17px; margin:22px 0 6px; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--accent); }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px; }
  .cols h2 { margin-top:0; }
  .cols ul { list-style:none; padding:0; }
  .cols li { margin:8px 0; }
  @media (max-width: 480px) { .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="./">Refy<span>nora</span></a>
  </header>
  <h1>Refy<span style="color:var(--accent)">nora</span></h1>
  <p class="meta">Seni değiştirmez, fotoğrafı düzeltir. · It doesn’t change you, it fixes the photo.</p>
  <div class="cols">
    <section>
      <h2>Türkçe</h2>
      <ul>
        <li><a href="gizlilik/">Gizlilik Politikası</a></li>
        <li><a href="kosullar/">Kullanım Koşulları</a></li>
        <li><a href="destek/">Destek</a></li>
      </ul>
    </section>
    <section>
      <h2>English</h2>
      <ul>
        <li><a href="privacy/">Privacy Policy</a></li>
        <li><a href="terms/">Terms of Use</a></li>
        <li><a href="support/">Support</a></li>
      </ul>
    </section>
  </div>
  <footer>© 2026 Refynora · <a href="mailto:cosduhalil@gmail.com">cosduhalil@gmail.com</a></footer>
</main>
</body>
</html>
